
<ion-header>
  <ion-toolbar>
    <!-- Left: Logo / Church Name -->
    <ion-buttons slot="start">
      <ion-button fill="clear" class="logo">
        ACK St James Koromosho
      </ion-button>
    </ion-buttons>
    <!-- Center: Navigation Links -->
    <div class="center-nav">
      <ion-button fill="clear" routerLink="./home" routerLinkActive="active-link">Home</ion-button>
      <ion-button fill="clear" routerLink="./about" routerLinkActive="active-link">About</ion-button>
      <ion-button fill="clear" routerLink="./visit" routerLinkActive="active-link">Visit</ion-button>
      <ion-button fill="clear" routerLink="./sermons" routerLinkActive="active-link">Sermons</ion-button>
      <ion-button fill="clear" routerLink="./ministries" routerLinkActive="active-link">Ministries</ion-button>
      <ion-button fill="clear" routerLink="./events" routerLinkActive="active-link">Events</ion-button>
      <ion-button fill="clear" routerLink="./contacts" routerLinkActive="active-link">Contacts</ion-button>
    </div>
    <!-- Right: Donate Button -->
    <ion-buttons slot="end">
      <ion-button fill="solid" color="primary" shape="round" routerLink="./donate">
        Donate
      </ion-button>
    </ion-buttons>

  </ion-toolbar>
</ion-header>
